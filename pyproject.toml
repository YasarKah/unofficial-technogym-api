[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technogym-unofficial"
version = "0.1.0"
description = "Unofficial, personal-use client for the Technogym / mywellness API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["technogym", "mywellness", "fitness", "api", "unofficial"]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
technogym = "technogym_unofficial.cli:main"

[project.urls]
Homepage = "https://github.com/YasarKah/unofficial-technogym-api"
Issues = "https://github.com/YasarKah/unofficial-technogym-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/technogym_unofficial"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
